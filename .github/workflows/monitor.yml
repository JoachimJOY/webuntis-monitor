name: WebUntis Monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: webuntis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
  monitor:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEBUNTIS_SCHOOL: ${{ secrets.WEBUNTIS_SCHOOL }}
      WEBUNTIS_USERNAME: ${{ secrets.WEBUNTIS_USERNAME }}
      WEBUNTIS_PASSWORD: ${{ secrets.WEBUNTIS_PASSWORD }}
      WEBUNTIS_PERSON_ID: ${{ secrets.WEBUNTIS_PERSON_ID }}
      WEBUNTIS_PERSON_TYPE: ${{ secrets.WEBUNTIS_PERSON_TYPE }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore comparison hashes
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: untis-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: untis-v1-
      - name: Check timetable
        run: python monitor.py
      - name: Save comparison hashes after success
        uses: actions/cache/save@v4
        with:
          path: .state
          key: untis-v1-${{ github.run_id }}-${{ github.run_attempt }}
