name: WebUntis Monitor
on:
  schedule:
    # The Sunday 09:00 slot also sends the weekly status email.
    - cron: '0 * * * 1-6'
      timezone: Europe/Berlin
    - cron: '0 0-8,10-23 * * 0'
      timezone: Europe/Berlin
    - cron: '0 9 * * 0'
      timezone: Europe/Berlin
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: webuntis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encrypted comparison support
        run: python -m pip install cryptography==50.0.2
      - run: python -m unittest -v
  monitor:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WEBUNTIS_SCHOOL: ${{ secrets.WEBUNTIS_SCHOOL }}
      WEBUNTIS_USERNAME: ${{ secrets.WEBUNTIS_USERNAME }}
      WEBUNTIS_PASSWORD: ${{ secrets.WEBUNTIS_PASSWORD }}
      WEBUNTIS_PERSON_ID: ${{ secrets.WEBUNTIS_PERSON_ID }}
      WEBUNTIS_PERSON_TYPE: ${{ secrets.WEBUNTIS_PERSON_TYPE }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encrypted comparison support
        run: python -m pip install cryptography==50.0.2
      - name: Restore encrypted comparison
        uses: actions/cache/restore@v4
        with:
          path: .state-details
          key: untis-details-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: untis-details-v2-
      - name: Check timetable
        run: python detailed_monitor.py
      - name: Save encrypted comparison after success
        uses: actions/cache/save@v4
        with:
          path: .state-details
          key: untis-details-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Send weekly WebUntis status email
        if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * 0'
        run: |
          python - <<'PY'
          from email_monitor import notify

          notify(
              "Wöchentliche Testnachricht: Der WebUntis-Monitor funktioniert. "
              "Der Stundenplan wurde erfolgreich abgerufen und geprüft."
          )
          PY
